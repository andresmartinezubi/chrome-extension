<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Preview</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <div class="page-meta">
          <span id="pageTitle" class="page-title">Screenshot</span>
          <span id="pageUrl"   class="page-url"></span>
        </div>
      </div>

      <div class="toolbar-right">
        <button id="zoomToggle" class="btn-ghost" title="Toggle zoom">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
          <span id="zoomLabel">Fit width</span>
        </button>

        <div class="divider"></div>

        <label class="format-label" for="formatSelect">Format</label>
        <select id="formatSelect" class="format-select">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
          <option value="pdf">PDF</option>
        </select>

        <button id="downloadBtn" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download
        </button>

        <button id="copyBtn" class="btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy
        </button>
      </div>
    </header>

    <main class="preview-area" id="previewArea">
      <div id="loadingState" class="state-overlay">
        <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <p>Loading screenshot…</p>
      </div>

      <div id="errorState" class="state-overlay hidden">
        <p id="errorMsg" class="error-text">Something went wrong.</p>
      </div>

      <div id="imageWrapper" class="image-wrapper hidden">
        <img id="screenshotImg" alt="Full page screenshot">
      </div>
    </main>

    <footer class="footer">
      <span id="dimensionsLabel" class="footer-label"></span>
    </footer>
  </div>
  <script src="../lib/jspdf.umd.min.js"></script>
  <script src="preview.js"></script>
</body>
</html>
